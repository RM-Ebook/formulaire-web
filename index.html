<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Client</title>
    <style>
        body {
            font-family: Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            background-color: #fffcfc;
            padding-top: 30px;
        }

        form {
            text-align: center;
        }

        .logo {
            all: unset;
            width: 450px !important;
            max-width: 100%;
            position: absolute;
            top: 40px;
            left: 50%;
            height: auto;
            margin-bottom: 10px;
            transform: translateX(-50%);
        }

        p {
            line-height: 1.8;
        }

        input,
        textarea {
            width: 310px;
            max-width: 100%;
            height: 40px;
            font-size: 1em;
            padding: 8px 8px 8px 15px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            display: block;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .submit-button {
            padding: 10px;
            background: #4854ac;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100px;
            height: 45px;
            font-size: 1em;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .submit-button:hover {
            background: #383c9c;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.4);
        }

        .reset-button {
            padding: 10px;
            background: #e8e4e4;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100px;
            height: 45px;
            font-size: 1em;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .reset-button:hover {
            background: #d8d4d4;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.4);
        }

        .submit-button,
        .reset-button {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .error {
            color: red;
            font-size: 0.8em;
        }

        .confirmation {
            display: none;
            color: green;
            font-size: 1em;
            margin-top: 25px;
        }
    </style>
</head>

<body>
    <img src="logo.png" alt="Logo" class="logo">
    <p style="text-align: center;">
        <span style="font-size: 1.3em;">Bienvenue !</span><br>
        Inscrivez-vous ici pour bénéficier de nos <br> offres exclusives.
    </p>

    <form id="clientForm">
        <label for="Lastname">Nom * :</label>
        <input type="text" id="Lastname" placeholder="ex: Dupont" required>
        <span class="error" id="LastnameError"></span>

        <label for="Firstname">Prénom * :</label>
        <input type="text" id="Firstname" placeholder="ex: Marie" required>
        <span class="error" id="FirstnameError"></span>

        <label for="birthdate">Date de naissance :</label>
        <input type="text" id="birthdate" placeholder="ex: 15/03/1990">
        <span class="error" id="birthdateError"></span>

        <label for="email">Email :</label>
        <input type="email" id="email" placeholder="ex: marie.dupont@gmail.com">
        <span class="error" id="emailError"></span>

        <label for="phone">Mobile * :</label>
        <input type="tel" id="phone" placeholder="ex: 0612345678" required>
        <span class="error" id="phoneError"></span>

        <label for="PostalCode">Code postal :</label>
        <input type="text" id="PostalCode" placeholder="ex: 75001">
        <span class="error" id="PostalCodeError"></span>

        <div class="button-group">
            <button type="submit" class="submit-button">Valider</button>
            <button type="reset" class="reset-button">Annuler</button>
        </div>

        <div id="confirmationMessage" class="confirmation">
            Formulaire envoyé avec succès !
        </div>
    </form>

    <script>
        document.getElementById("clientForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const lastname = document.getElementById("Lastname").value.trim();
            const firstname = document.getElementById("Firstname").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const postalCode = document.getElementById("PostalCode").value.trim();
            const birthdate = document.getElementById("birthdate").value.trim();

            let valid = true;

            document.getElementById("LastnameError").textContent = lastname ? "" : "Nom requis";
            document.getElementById("FirstnameError").textContent = firstname ? "" : "Prénom requis";
            document.getElementById("phoneError").textContent = phone.match(/^[0-9]{10}$/) ? "" : "Numéro invalide";

            let emailValid = true;
            if (email !== "" && !email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
                document.getElementById("emailError").textContent = "Email invalide";
                emailValid = false;
            } else {
                document.getElementById("emailError").textContent = "";
            }

            let codePostal = "";
            if (postalCode !== "") {
                if (/^\d{5}$/.test(postalCode)) {
                    document.getElementById("PostalCodeError").textContent = "";
                    codePostal = postalCode;
                } else {
                    document.getElementById("PostalCodeError").textContent = "Code postal invalide";
                    valid = false;
                }
            } else {
                document.getElementById("PostalCodeError").textContent = "";
            }

            let moisNaiss = "";
            let anneeNaiss = "";

            if (birthdate !== "") {
                const birthMatch = birthdate.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
                if (birthMatch) {
                    const day = parseInt(birthMatch[1], 10);
                    const month = parseInt(birthMatch[2], 10);
                    const year = parseInt(birthMatch[3], 10);
                    const dateObj = new Date(year, month - 1, day);
                    if (
                        dateObj.getFullYear() === year &&
                        dateObj.getMonth() === month - 1 &&
                        dateObj.getDate() === day
                    ) {
                        document.getElementById("birthdateError").textContent = "";
                        moisNaiss = birthMatch[2] + birthMatch[1];
                        anneeNaiss = birthMatch[3];
                    } else {
                        document.getElementById("birthdateError").textContent = "Date invalide";
                        valid = false;
                    }
                } else {
                    document.getElementById("birthdateError").textContent = "Format attendu : jj/mm/aaaa";
                    valid = false;
                }
            } else {
                document.getElementById("birthdateError").textContent = "";
            }

            valid = valid && lastname && firstname && phone.match(/^[0-9]{10}$/) && emailValid;

            if (valid) {
                const url = `https://VOTRE_DOMAINE/VOTRE_CHEMIN.php?nom=${encodeURIComponent(lastname)}&prenom=${encodeURIComponent(firstname)}&mobile=${encodeURIComponent(phone)}&optInSMS=1&codePostal=${encodeURIComponent(codePostal)}&moisNaiss=${encodeURIComponent(moisNaiss)}&anneeNaiss=${encodeURIComponent(anneeNaiss)}`;
                fetch(url, {
                    method: 'GET',
                    mode: 'no-cors'
                }).then(() => {
                    const messageDiv = document.getElementById("confirmationMessage");
                    messageDiv.style.display = "block";
                    messageDiv.style.color = "green";
                    messageDiv.textContent = "Formulaire envoyé avec succès !";
                    setTimeout(() => {
                        messageDiv.style.display = "none";
                        document.getElementById("clientForm").reset();
                    }, 5000);
                }).catch(error => {
                    console.error("Erreur :", error);
                });
            }
        });
    </script>

    <footer style="text-align: center; margin-top: 50px; font-size: 0.7em; color: #555;">
        <p>Copyright &copy; 2025</p>
    </footer>

</body>
</html>
